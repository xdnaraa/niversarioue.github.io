<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>diário</title>

<style>
  body {
    margin: 0;
    background: #0f0f0f;
    color: #eaeaea;
    font-family: Arial;
    overflow: hidden;
  }

  .container {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
  }

  .foto {
    width: 200px;
    height: 200px;
    background: url('https://via.placeholder.com/200') center/cover;
    filter: grayscale(80%);
    cursor: pointer;
  }

  .texto {
    margin-top: 20px;
    opacity: 0.8;
  }

  /* hotspot invisível */
  .segredo {
    position: absolute;
    top: 30%;
    left: 60%;
    width: 80px;
    height: 80px;
    cursor: pointer;
  }

  .hidden {
    display: none;
  }

</style>
</head>

<body>

<div class="container">
  <div class="foto" onclick="revelar()"></div>
  <div class="texto">não tem nada aqui. sério.</div>
</div>

<div class="segredo" onclick="abrirSegredo()"></div>

<div id="arquivo" class="hidden">
  <h2>VOCÊ NÃO ERA PRA TER CHEGADO AQUI</h2>
  <p>30/04 — registro corrompido</p>
</div>

<script>
function revelar() {
  document.body.style.background = "#000";
  alert("algo mudou.");
}

function abrirSegredo() {
  document.getElementById("arquivo").classList.remove("hidden");
}
</script>

</body>
</html>
