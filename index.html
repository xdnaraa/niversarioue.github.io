<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elio Varga</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #eaeaea;
      overflow-x: hidden;
    }

    .center {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      padding: 20px;
    }

    button {
      margin-top: 20px;
      padding: 10px 18px;
      background: transparent;
      border: 1px solid #fff;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .hidden {
      display: none;
    }

    .topbar {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      padding: 10px;
      background: rgba(0,0,0,0.7);
    }

    .section {
      padding: 80px 20px;
      min-height: 100vh;
    }

    .gallery img {
      width: 200px;
      margin: 10px;
      opacity: 0.8;
      filter: grayscale(100%);
    }

    .glitch {
      animation: flicker 3s infinite;
    }

    @keyframes flicker {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .secret {
      color: black;
      user-select: none;
    }

  </style>
</head>
<body>

<div id="home" class="center">
  <h1 class="glitch">você encontrou isso tarde demais.</h1>
  <button onclick="enterSite()">continuar</button>
</div>

<div id="site" class="hidden">

  <div class="topbar">
    <div onclick="showSection('gallery')">memórias</div>
    <div onclick="showSection('music')">sons</div>
    <div onclick="showSection('diary')">diário</div>
  </div>

  <div id="gallery" class="section hidden">
    <h2>memórias</h2>
    <div class="gallery">
      <img src="https://picsum.photos/200?random=1" />
      <img src="https://picsum.photos/200?random=2" />
      <img src="https://picsum.photos/200?random=3" />
      <img src="https://picsum.photos/200?random=4" />
    </div>
  </div>

  <div id="music" class="section hidden">
    <h2>sons dele</h2>
    <p>playlist não disponível</p>
    <p class="glitch">faixa: não escute isso</p>
  </div>

  <div id="diary" class="section hidden">
    <h2>diário</h2>
    <p>hoje eu acordei antes de existir</p>
    <p>se alguém ler isso, já é tarde</p>
    <p id="glitchText">eu não lembro se isso é meu</p>
  </div>

  <div class="section">
    <p class="secret" onclick="secret()">.</p>
  </div>

</div>

<script>

function enterSite() {
  document.getElementById('home').style.display = 'none';
  document.getElementById('site').classList.remove('hidden');
  showSection('gallery');
}

function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function secret() {
  alert('ele ainda está aqui?');
  document.body.style.background = '#000';
  document.getElementById('glitchText').innerText = 'você não deveria ver isso';
}

setInterval(() => {
  const texts = [
    'eu não lembro se isso é meu',
    'ou é?',
    'alguém está olhando isso'
  ];
  document.getElementById('glitchText').innerText = texts[Math.floor(Math.random()*texts.length)];
}, 5000);

</script>

</body>
</html>
