<!DOCTYPE html>
<html>
<head>
  <title>🩸</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
      text-align: center;
    }

    .tela-login {
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    input {
      padding: 10px;
      margin: 10px;
      border-radius: 8px;
      border: none;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #ff4da6;
      color: white;
      cursor: pointer;
    }

    .conteudo {
      display: none;
      padding: 30px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .caixa {
      background: #111;
      padding: 20px;
      border-radius: 16px;
      width: 80%;
      max-width: 700px;
      position: relative;
      overflow: hidden;
    }

    .fechar {
      position: absolute;
      right: 15px;
      top: 10px;
      cursor: pointer;
      font-size: 22px;
    }

    .carrossel {
      display: flex;
      transition: transform 0.5s ease;
    }

    .paused {
      filter: blur(2px);
    }

    .foto {
      min-width: 100%;
      padding: 10px;
      box-sizing: border-box;
    }

    .polaroid {
      background: white;
      color: black;
      padding: 10px 10px 20px;
      border-radius: 10px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .polaroid img {
      width: 100%;
      border-radius: 8px;
      transition: transform 5s ease;
    }

    .foto.ativa img {
      transform: scale(1.08);
    }

    .dots {
      margin-top: 10px;
    }

    .seta {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 28px;
      cursor: pointer;
    }

    .esq { left: 10px; }
    .dir { right: 10px; }

    #status {
      color: #ff4da6;
      font-weight: bold;
    }

    #timer {
      opacity: 0.7;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="tela-login">
  <h2>só você pode entrar...se conseguir ;b</h2>
  <input type="password" id="senha">
  <button onclick="entrar()">entrar</button>
  <p id="erro"></p>
</div>

<div class="conteudo" id="site">

  <h1>feliz aniversário mamaim🎂</h1>

  <button onclick="abrir()">abrir memórias</button>

  <h3 id="contador"></h3>

  <br>

  <button onclick="abrirVideo()">assista isso quando estiver sozinha👀</button>

  <div id="videoBox" style="display:none;">
    <video width="80%" controls>
      <source src="https://i.imgur.com/1h9wuml.mp4">
    </video>
  </div>

  <br>

  <button onclick="mostrarMsg()">mensagem secreta</button>
  <p id="msg2" style="display:none;"></p>

  <button onclick="mensagemSeria()">ok… agora é sério</button>

  <p id="msgSeria" style="display:none; max-width:500px; margin:auto;">
    obrigada por tudo que você faz por mim… eu lembro de tudo, até das coisas pequenas. te amo muito.
  </p>

  <br>

  <button onclick="ultima()">clica aqui… confia</button>
  <div id="final" style="display:none; font-size:20px;">💗💗💗</div>

</div>

<div class="modal" id="modal">

  <div class="caixa">

    <span class="fechar" onclick="fechar()">×</span>

    <h2>📸 memórias</h2>

    <div id="status">▶ PLAYING</div>
    <div id="timer">tempo: 0s</div>

    <div class="seta esq" onclick="voltar()">‹</div>
    <div class="seta dir" onclick="avancar()">›</div>

    <div class="carrossel" id="carrossel">

      <!-- SUAS FOTOS (mantidas) -->
      <div class="foto"><div class="polaroid"><img src="https://i.imgur.com/qrqDbf6.jpeg"></div></div>
      <div class="foto"><div class="polaroid"><img src="https://i.imgur.com/uf5jXUq.jpeg"></div></div>
      <div class="foto"><div class="polaroid"><img src="https://i.imgur.com/JejIDFM.jpeg"></div></div>
      <div class="foto"><div class="polaroid"><img src="https://i.imgur.com/ZwTaOfS.jpeg"></div></div>
      <div class="foto"><div class="polaroid"><img src="https://i.imgur.com/fNo9fMD.jpeg"></div></div>
      <div class="foto"><div class="polaroid"><img src="https://i.imgur.com/6GHpaYH.jpeg"></div></div>
      <div class="foto"><div class="polaroid"><img src="https://i.imgur.com/LSgZ1PW.jpeg"></div></div>
      <div class="foto"><div class="polaroid"><img src="https://i.imgur.com/i7HlWfy.jpeg"></div></div>
      <div class="foto"><div class="polaroid"><img src="https://i.imgur.com/ybgL46D.jpeg"></div></div>

    </div>

    <div class="dots" id="dots"></div>

  </div>
</div>

<audio id="camera-sound">
  <source src="https://www.soundjay.com/mechanical/camera-shutter-click-01.mp3">
</audio>

<audio id="musica" loop>
  <source src="https://files.catbox.moe/3vgiy3.mp3">
</audio>

<script>

let index = 0;
let pausado = false;
let tempo = 0;
let tentativas = 0;
let autoPlay = null;
let timerInterval = null;

/* LOGIN */
function entrar() {
  const senha = document.getElementById("senha").value;

  if (senha === "29/12") {
    document.querySelector(".tela-login").style.display = "none";
    document.getElementById("site").style.display = "block";
    atualizarContador();
  } else {
    tentativas++;
    const msgs = ["errou 🤨","tem certeza que é minha mãe mesmo?","suspeito...","ok agora fiquei preocupada"];
    document.getElementById("erro").innerText = msgs[Math.min(tentativas-1, msgs.length-1)];
  }
}

/* CONTADOR */
function atualizarContador() {
  const inicio = new Date("2010-01-01");
  const hoje = new Date();
  const dias = Math.floor((hoje - inicio) / (1000*60*60*24));
  document.getElementById("contador").innerText = "sendo sua cria há: " + dias + " dias 💗";
}

/* VIDEO */
function abrirVideo() {
  const box = document.getElementById("videoBox");
  box.style.display = box.style.display === "block" ? "none" : "block";
}

/* MENSAGENS */
function mostrarMsg() {
  const el = document.getElementById("msg2");
  el.style.display = el.style.display === "block" ? "none" : "block";
  el.innerText = "mereço um sushizinho pelo esforço, né?";
}

function mensagemSeria() {
  const el = document.getElementById("msgSeria");
  el.style.display = el.style.display === "block" ? "none" : "block";
}

function ultima() {
  document.getElementById("final").style.display = "block";
}

/* MODAL */
function abrir() {
  document.getElementById("modal").style.display = "flex";

  const musica = document.getElementById("musica");
  musica.play().catch(()=>{});

  pausado = false;

  iniciarTimer();

  clearInterval(autoPlay);
  autoPlay = setInterval(() => {
    if (!pausado) avancar();
  }, 5000);

  atualizar();
}

function fechar() {
  document.getElementById("modal").style.display = "none";
  clearInterval(autoPlay);
  clearInterval(timerInterval);
}

/* CARROSSEL */
function atualizar() {
  const carrossel = document.getElementById("carrossel");
  carrossel.style.transform = `translateX(${-index * 100}%)`;

  document.querySelectorAll(".foto").forEach(f => f.classList.remove("ativa"));
  document.querySelectorAll(".foto")[index].classList.add("ativa");

  criarDots();
}

function avancar() {
  const total = document.querySelectorAll(".foto").length;
  index = (index + 1) % total;
  atualizar();
}

function voltar() {
  const total = document.querySelectorAll(".foto").length;
  index = (index - 1 + total) % total;
  atualizar();
}

/* DOTS */
function criarDots() {
  const total = document.querySelectorAll(".foto").length;
  const dots = document.getElementById("dots");
  dots.innerHTML = "";

  for (let i = 0; i < total; i++) {
    const dot = document.createElement("span");
    dot.style.display = "inline-block";
    dot.style.width = "8px";
    dot.style.height = "8px";
    dot.style.margin = "4px";
    dot.style.borderRadius = "50%";
    dot.style.background = i === index ? "#ff4da6" : "#555";

    dot.onclick = () => {
      index = i;
      atualizar();
    };

    dots.appendChild(dot);
  }
}

/* TIMER */
function iniciarTimer() {
  tempo = 0;
  clearInterval(timerInterval);

  timerInterval = setInterval(() => {
    if (!pausado) {
      tempo++;
      document.getElementById("timer").innerText = "tempo: " + tempo + "s";
    }
  }, 1000);
}

/* PAUSE */
function togglePause() {
  pausado = !pausado;
}

/* CLICK */
document.getElementById("modal").addEventListener("click", (e) => {
  if (!e.target.classList.contains("seta") &&
      !e.target.classList.contains("fechar")) {
    togglePause();
  }
});

</script>

</body>
</html>
