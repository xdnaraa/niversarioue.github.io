<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>error</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      color: #eaeaea;
      font-family: Arial, sans-serif;
      flex-direction: column;
      overflow: hidden;
    }

    .card {
      text-align: center;
      padding: 24px;
      max-width: 500px;
    }

    h1 {
      font-size: 22px;
      font-weight: normal;
      margin-bottom: 20px;
      opacity: 0.9;
    }

    button {
      margin: 6px;
      padding: 10px 14px;
      border: 1px solid #333;
      background: transparent;
      color: #eaeaea;
      cursor: pointer;
      border-radius: 8px;
      transition: 0.2s;
    }

    button:hover {
      background: #1a1a1a;
    }

    #subtext {
      margin-top: 18px;
      font-size: 14px;
      opacity: 0.7;
      min-height: 20px;
    }

    .tiny-button {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #eaeaea;
      opacity: 0.05;
      border-radius: 50%;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 id="title">você tá aqui de novo.</h1>

    <button onclick="answer('sim')">sim</button>
    <button onclick="answer('não')">não</button>
    <button onclick="answer('talvez')">talvez</button>

    <div id="subtext"></div>
  </div>

  <div class="tiny-button" id="secret" onclick="secretClick()"></div>

  <script>
    let state = 0;

    const phrases = [
      "isso não leva a lugar nenhum.",
      "parabéns.",
      "você ainda tá aqui.",
      "ok.",
      "interessante escolha.",
      "isso foi previsível.",
      "você sempre volta."
    ];

    function answer(type) {
      const title = document.getElementById("title");
      const sub = document.getElementById("subtext");

      state++;

      if (type === "sim") {
        title.textContent = "eu sabia.";
      } else if (type === "não") {
        title.textContent = "mentiroso.";
      } else {
        title.textContent = "indecisão detectada.";
      }

      sub.textContent = phrases[state % phrases.length];
      moveSecret();
    }

    function secretClick() {
      const sub = document.getElementById("subtext");
      sub.textContent = "você achou isso rápido demais.";
      moveSecret();
    }

    function moveSecret() {
      const secret = document.getElementById("secret");
      secret.style.top = Math.random() * 90 + "vh";
      secret.style.left = Math.random() * 90 + "vw";
    }

    setInterval(() => {
      const sub = document.getElementById("subtext");
      if (Math.random() > 0.7) {
        sub.textContent = "você ainda tá pensando nisso.";
      }
    }, 5000);

    moveSecret();
  </script>

</body>
</html>
